name: Publish validated site
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh dashboard', 'Update rail game']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select latest successful game and dashboard
        id: components
        uses: actions/github-script@v7
        with:
          script: |
            const {select} = require('./scripts/select_publication.cjs');
            const result = await select({github, context});
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            core.info(JSON.stringify(result));
      - name: Checkout validated game source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.components.outputs.game_sha }}
          path: game-source
      - name: Download validated dashboard snapshot
        if: steps.components.outputs.dashboard_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: dashboard-public
          path: dashboard-source
          github-token: ${{ github.token }}
          run-id: ${{ steps.components.outputs.dashboard_run_id }}
      - name: Bootstrap previously deployed dashboard
        if: steps.components.outputs.dashboard_run_id == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.components.outputs.dashboard_sha }}
          path: dashboard-source
      - name: Assemble complete site without overwriting either component
        env:
          DASHBOARD_SHA: ${{ steps.components.outputs.dashboard_sha }}
          DASHBOARD_RUN_ID: ${{ steps.components.outputs.dashboard_run_id }}
          GAME_SHA: ${{ steps.components.outputs.game_sha }}
          GAME_RUN_ID: ${{ steps.components.outputs.game_run_id }}
        run: node scripts/site_artifacts.cjs assemble dashboard-source game-source _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
