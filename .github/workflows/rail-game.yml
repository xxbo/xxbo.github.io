name: Update rail game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rail/**'
      - 'rust/**'
      - 'scripts/*rail*'
      - 'scripts/fixtures/rail-*'
      - 'scripts/site_artifacts.cjs'
      - 'scripts/select_publication.cjs'
      - 'scripts/test_site_publication.cjs'
      - '.github/workflows/rail-game.yml'
      - '.github/workflows/publish-site.yml'
permissions:
  contents: read
concurrency:
  group: rail-game-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Rust core source and WASM artifact
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          node scripts/build_rail_wasm.cjs --check
      - name: Verify game simulation and publication contracts
        run: |
          node scripts/run_rail_tests.cjs
          node scripts/test_site_publication.cjs
