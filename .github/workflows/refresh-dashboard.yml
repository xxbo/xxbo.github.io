name: Refresh dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '5,15 7 * * 1-5'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'scripts/**'
      - 'rail/index.html'
      - '.github/workflows/refresh-dashboard.yml'
      - '.github/workflows/publish-site.yml'
permissions:
  contents: write
concurrency:
  group: dashboard-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify dashboard and publication contracts
        run: |
          node scripts/run_dashboard_tests.cjs
          node scripts/test_site_publication.cjs
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Collect public data
        run: |
          node scripts/archive_snapshot.cjs
          python scripts/update_data.py
          node scripts/archive_snapshot.cjs
      - name: Stage validated dashboard snapshot
        run: node scripts/site_artifacts.cjs dashboard . _dashboard
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dashboard data'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-public
          path: _dashboard
          retention-days: 90
          if-no-files-found: error
