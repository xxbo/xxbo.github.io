name: Refresh dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths: ['index.html', 'style.css', 'app.js', 'home.js', 'brief.js', 'topics.js', 'topic-pages.js', 'calendar.js', 'calendar-pages.js', 'health-pages.js', 'events.js', 'event-pages.js', 'market-context.js', 'context-pages.js', 'pages.js', 'reader.js', 'technical.js', 'analysis-pages.js', 'scripts/**', '.github/workflows/refresh-dashboard.yml']
permissions:
  contents: write
concurrency:
  group: dashboard-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify indicator calculations
        run: |
          node scripts/test_technical.cjs
          node scripts/test_market_context.cjs
          node scripts/test_brief.cjs
          node scripts/test_topics.cjs
          node scripts/test_event_tracking.cjs
          node scripts/test_dashboard.cjs
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Collect public data
        run: python scripts/update_data.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dashboard data'
            git push
          fi
      # A GITHUB_TOKEN commit does not trigger the branch Pages build. Deploy here.
      - name: Stage public files
        run: |
          mkdir -p _site/data
          cp market-context.js context-pages.js events.js event-pages.js index.html style.css brief.js topics.js topic-pages.js calendar.js calendar-pages.js health-pages.js home.js app.js pages.js reader.js technical.js analysis-pages.js _site/
          cp data/dashboard.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
