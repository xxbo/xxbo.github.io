name: Refresh dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
  push:
    branches: [main]
    paths: ['scripts/update_data.py', '.github/workflows/refresh-dashboard.yml']
permissions:
  contents: write
concurrency:
  group: dashboard-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public data
        run: python scripts/update_data.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dashboard data'
            git push
          fi
      # A GITHUB_TOKEN commit does not trigger the branch Pages build. Deploy here.
      - name: Stage public files
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/dashboard.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
