<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7f8"><title>轨道都市 · 线路地图</title><meta name="description" content="在地图上规划线路，查看列车运行与线路运营信息。"><link rel="stylesheet" href="style.css?v=3"><script src="engine.js?v=3" defer></script><script src="operations.js?v=3" defer></script><script src="network.js?v=3" defer></script><script src="ui.js?v=3" defer></script></head>
<body>
<main id="stage" aria-label="轨道都市地图">
<svg id="map" viewBox="0 0 1040 740" role="group" aria-label="铁路线路地图，可拖动、缩放和选择线路"></svg>
<div class="identity"><a href="../index.html#/overview" aria-label="返回观潮">←</a><div><h1>轨道都市<span>MAP / 03</span></h1><small>东京圈 · 自由线路实验</small></div></div>
<div class="clock-control"><span class="clock-dot"></span><strong id="clock">07:00</strong><button id="play" aria-label="暂停运行">Ⅱ</button><select id="speed" aria-label="模拟速度"><option value="1">1×</option><option value="3">3×</option><option value="6">6×</option></select></div>
<div class="map-zoom" aria-label="地图缩放"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="zoom-reset" aria-label="复位地图">⌖</button></div>
<div id="map-hint">点击线路查看详情 · 拖动地图浏览</div>
<div class="line-legend" id="legend" aria-label="地图线路"></div>
</main>
<div class="main-actions"><button id="add-line"><span>＋</span> 增加线路</button><button id="delete-line" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg> 删除线路</button></div>
<aside id="line-panel" hidden aria-label="线路详细信息"></aside>
<div id="edit-bar" hidden></div>
<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="undo" hidden>撤销</button></div>
</body></html>
