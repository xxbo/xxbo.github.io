<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7f8"><title>轨道都市 · 线路地图</title><meta name="description" content="在地图上规划线路，查看列车运行与线路运营信息。"><link rel="stylesheet" href="style.css?v=6"><script src="engine.js?v=6" defer></script><script src="operations.js?v=6" defer></script><script src="tokyo.js?v=6" defer></script><script src="network.js?v=6" defer></script><script src="street-map.js?v=6" defer></script><script src="city.js?v=6" defer></script><script src="passengers.js?v=6" defer></script><script src="management.js?v=6" defer></script><script src="ui.js?v=6" defer></script></head>
<body><div id="game-loading" role="status"><b>轨道都市</b><span>正在生成城市与出行需求…</span></div>
<main id="stage" aria-label="轨道都市地图">
<canvas id="density-canvas" aria-hidden="true"></canvas><div id="street-tiles" aria-hidden="true"></div><svg id="map" viewBox="0 0 1040 740" role="group" aria-label="铁路线路地图，可拖动、缩放和选择线路"></svg>
<div class="identity"><a href="../index.html#/overview" aria-label="返回观潮">←</a><div><h1>轨道都市<span>MAP / 06</span></h1><small>东京首都圈 · 线路运营</small></div></div>
<div class="clock-control"><span class="clock-dot"></span><strong id="clock">07:00</strong><button id="play" aria-label="暂停运行">Ⅱ</button><select id="speed" aria-label="模拟速度"><option value="1">1×</option><option value="3">3×</option><option value="6">6×</option></select><span id="game-day">第 1 天</span></div>
<button id="account-toggle" class="budget-strip"><span>可用余额</span><strong id="cash-value">50.00 亿円</strong><small id="debt-value">无贷款</small></button>
<div class="map-zoom" aria-label="地图缩放"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="zoom-reset" aria-label="复位地图">⌖</button></div>
<div class="map-tools"><select id="basemap-select" aria-label="街道底图"><option value="gsi">街道 · 地理院</option><option value="osm">街道 · OSM</option><option value="schematic">简洁示意</option></select><button id="retry-map" aria-label="重新加载街道地图">↻</button><select id="density-select" aria-label="城市密度图层"><option value="off">密度 · 关闭</option><option value="people">居住人口</option><option value="shops">商业密度</option><option value="industry">工业密度</option></select><button id="fit-region">全域</button><button id="fit-core">都心</button><label><input id="map-labels" type="checkbox" checked>站名</label></div><div class="map-scale"><span id="scale-bar"></span><b id="scale-text">5 km</b><small></small></div><div id="density-legend" hidden></div><div id="tile-status" role="status" hidden></div><div id="map-attribution"><a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a><span> · </span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div><div id="map-hint">点击线路查看详情 · 拖动地图浏览</div>
<div class="line-legend" id="legend" aria-label="地图线路"></div>
</main>
<div class="main-actions"><button id="overview-toggle">▤ 运营总览</button><button id="add-line"><span>＋</span> 增加线路</button><button id="delete-line" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg> 删除线路</button><button id="new-game">开始新游戏</button></div>
<aside id="overview-panel" hidden aria-label="全部线路运营总览"></aside>
<aside id="line-panel" hidden aria-label="线路详细信息"></aside>
<aside id="activity-panel" hidden aria-label="实时客流详情"></aside><aside id="account-panel" hidden aria-label="资金与贷款"></aside>
<dialog id="newgame-dialog" aria-labelledby="newgame-title"><h2 id="newgame-title">开始新游戏？</h2><p>将清除自建线路、借款、运营记录与当前客流，恢复初始东京圈线路和 <b>50 亿円</b>余额。此操作无法撤销。</p><div><button id="cancel-newgame">保留当前游戏</button><button id="confirm-newgame" class="danger-button">确认清空并开始</button></div></dialog>
<div id="edit-bar" hidden></div>
<div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="undo" hidden>撤销</button></div>
</body></html>
